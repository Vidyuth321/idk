<!DOCTYPE html>
<html>
    <body>

        <h2>Javascript Arrow</h2>

        <p>This example shows arrow function with a parameter</p>

        <p id="result"></p>

        <script>
            const add = (a,b) => a + b;

            document.getElementById("result").innerHTML = add(100,463673)
        </script>
    </body>
</html>
