<!DOCTYPE html>
<html>

<body>
    <h2>67</h2>
    <p>here is how</p>
    <p>Today this is the best car</p>
    <p id="details"></p>
    <script>
        class Car {
            constructor(brand) {
                this.carname = brand;
            }
            present() {
                return 'I have a ' + this.carname;
            }
        }

        class Model extends Car {
            constructor(brand, mod) {
                super(brand);
                this.model = mod;
            }

            show() {
                return this.present() + ', it is a ' + this.model
            }

        }

        let myCar = new Model("Apple", "Ultra");
        document.getElementById("details").innerHTML = myCar.show();
    </script>
</body>

</html>
