<!DOCTYPE html>
<html>
    <body>
        <p id="student1"></p>
        <p id="student2"></p>

        <script>
            // Creating a class
            class Student {
                constructer(name,year){
this.name = name;
this.year = year;
                }

                // Age method
                age() {
                    let date = new Date();
                    return date.getFullYear() - this.year;
                }
            }

            // Using the class with two subjects
            const student1 = new Student("Hulk", 1989);
            document.getElementById("student1").innerHTML =
            "My name is" + student1.name + ". I was born in " + student1.year + ". And my age is + student1.age(2)";
        const student2 = new Student("Spider man", 2015);
            document.getElementById("student1").innerHTML =
                "My name is" + student2.name + ". I was born in " + student2.year + ". And my age is + student2.age(5)";
        </script>
    </body>
</html>
