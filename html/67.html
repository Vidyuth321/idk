<!DOCTYPE html>
<html>
    <head>
        <style>
            div.first{
                Opacity:0.1;
            }
            div.second{
                Opacity:0.3;
            }
            div.third{
                Opacity:0.89;
            }
        </style>
    </head>
    <body>
        <h1>Opacity property</h1>
        <p>This is how the property looks like</p>
        <div class="first"><p>Opacity 0.1</p></div>
        <div class="second">
            <p>Opacity 0.3</p>
        </div>
        <div class="third">
            <p>Opacity 0.6</p>
        </div>
    </body>
</html>
