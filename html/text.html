<!DOCTYPE html>
<html>
    <head>
        <style>
            h1{
                text-decoration: solid ;
                text-transform: uppercase;
            }
            h2{
                text-align: right;
                text-decoration: dotted;
                text-transform: unset;
            }
            h3{
                text-overflow: ellipsis;
                text-decoration: line-through;
                text-transform: lowercase;
            }
        </style>
    </head>
    <body>
<h1>soinc</h1>
<h2>shadow</h2>
<h3>tails</h3>
    </body>
</html>
